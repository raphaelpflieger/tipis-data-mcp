---
# tipis-data-mcp vault template. Copy to ansible_secrets.yml, fill, `ansible-vault encrypt`.
# Never commit the unencrypted file.

# GitHub deploy token (read access to raphaelpflieger/tipis-data-mcp)
github_access_token: "CHANGEME-github-token"
github_repository: "raphaelpflieger/tipis-data-mcp"

# Google OAuth client (Google Cloud console → APIs & Services → Credentials): see docs/google-oauth.md
datamcp_google_client_id: "CHANGEME-123456789-abc.apps.googleusercontent.com"
datamcp_google_client_secret: "CHANGEME-GOCSPX-..."

# FastMCP token signing key: openssl rand -base64 48 (rotating it re-authenticates every client)
datamcp_jwt_signing_key: "CHANGEME-openssl-rand-base64-48"
# Fernet key of the OAuth state store:
#   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
datamcp_storage_key: "CHANGEME-fernet-key"

# The read-only database passwords: SAME values as pg_analytics_password in the tipis-postgres
# and tipis-metrics vaults.
datamcp_primary_db_password: "CHANGEME-tipis-postgres-pg_analytics_password"
datamcp_metrics_db_password: "CHANGEME-tipis-metrics-pg_analytics_password"

# Who may use the connector (Google accounts; each must also be a test user of the OAuth client).
datamcp_allowed_emails:
  - "CHANGEME-organisation@gmail.com"
